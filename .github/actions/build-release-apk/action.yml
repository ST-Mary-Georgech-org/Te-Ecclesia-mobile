name: Build Release APK

inputs:
  android-keystore-base64:
    required: true
    description: Base64 encoded content of the Android keystore file
  keystore-password:
    required: true
    description: Password for the Android keystore
  android-key-alias:
    required: true
    description: Alias for the key in the Android keystore
  android-key-alias-password:
    required: true
    description: Password for the key alias in the Android keystore
  base-url:
    required: true
    description: Base URL to be used in local.properties
  credential-file-content-base64:
    required: true
    description: Content of the google-services.json file

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Create local.properties with base URLs
      shell: bash
      run: |
        echo "BASE_URL=${{ inputs.base-url }}" >> local.properties

    - name: Create google-services.json
      shell: bash
      run: echo "${{ inputs.credential-file-content-base64 }}" | base64 --decode > androidApp/google-services.json

    - name: Create keystore file
      shell: bash
      run: echo "${{ inputs.android-keystore-base64 }}" | base64 --decode > androidApp/teEcclesia-keystore.jks

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Get Version Name
      shell: bash
      run: |
        VERSION_MAJOR=$(grep VERSION_MAJOR gradle.properties | cut -d'=' -f2 | xargs)
        VERSION_MINOR=$(grep VERSION_MINOR gradle.properties | cut -d'=' -f2 | xargs)
        RUN_NUMBER=${{ github.run_number }}
        
        APK_VERSION=${VERSION_MAJOR}.${VERSION_MINOR}.${RUN_NUMBER}
        
        echo "APK_VERSION=$APK_VERSION" >> $GITHUB_ENV

    - name: Version Bump
      uses: chkfung/android-version-actions@v1.2.3
      with:
        gradlePath: androidApp/build.gradle.kts
        versionCode: ${{ github.run_number }}
        versionName: ${{ env.APK_VERSION }}

    - name: Generate unsigned APK
      shell: bash
      run: ./gradlew :androidApp:assembleRelease --build-cache -x test -x lint

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: androidApp/build/outputs/apk/release
        signingKeyBase64: ${{ inputs.android-keystore-base64 }}
        keyStorePassword: ${{ inputs.keystore-password }}
        alias: ${{ inputs.android-key-alias }}
        keyPassword: ${{ inputs.android-key-alias-password }}
      env:
        BUILD_TOOLS_VERSION: "35.0.0"

    - name: Set signed APK path to env
      shell: bash
      run: |
        RELEASE_DIRECTORY="androidApp/build/outputs/apk/release"
        APK_NAME="TeEcclesia-v${APK_VERSION}"
 
        mv "$RELEASE_DIRECTORY/androidApp-release-unsigned-signed.apk" \
        "$RELEASE_DIRECTORY/$APK_NAME.apk"        
 
        echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
        echo "SIGNED_APK_PATH=$RELEASE_DIRECTORY/$APK_NAME.apk" >> $GITHUB_ENV