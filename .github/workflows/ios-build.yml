name: iOS

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  detect:
    name: Detect Changes
    uses: ./.github/workflows/detect-changed-modules.yml
    secrets: inherit

  build:
    name: Build
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create local.properties file
        run: |
          cat > local.properties << EOF
          BASE_URL=${{ secrets.BASE_URL }}
          KEYSTORE_STORE_FILE=teEcclesiaApp/teEcclesia-keystore.jks
          KEYSTORE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          EOF

      - name: Decode and create keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > teEcclesiaApp/teEcclesia-keystore.jks

      - name: Create GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > iosApp/iosApp/GoogleService-Info.plist

      - name: Generate dummy framework
        run: ./gradlew :teEcclesiaApp:generateDummyFramework

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: iosApp/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Ensure Podfile exists
        run: |
          if [ ! -f iosApp/Podfile ]; then
            cd iosApp && pod init
          fi

      - name: Install CocoaPods
        run: pod install --repo-update --project-directory=iosApp

      - name: Build KMP modules
        if: needs.detect.outputs.has_ios_changes == 'true'
        run: ./gradlew $(for m in $(echo '${{ needs.detect.outputs.ios_modules }}' | jq -r '.[]'); do echo ":$m:linkDebugFrameworkIosSimulatorArm64"; done) --parallel --build-cache

      - name: Build iOS app
        if: needs.detect.outputs.has_ios_changes == 'true'
        run: |
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme "iosApp" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
