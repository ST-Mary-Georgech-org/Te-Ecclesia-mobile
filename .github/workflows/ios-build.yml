name: iOS

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      build_kids:
        description: 'Build Kids scheme (TeEcclesia-Kids)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'build-kids'
    uses: ./.github/workflows/detect-changed-modules.yml
    secrets: inherit

  build:
    name: Build
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            iosApp/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create local.properties file
        run: |
          cat > local.properties << EOF
          BASE_URL=${{ secrets.BASE_URL }}
          KEYSTORE_STORE_FILE=androidApp/teEcclesia-keystore.jks
          KEYSTORE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          EOF

      - name: Decode and create keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > androidApp/teEcclesia-keystore.jks

      - name: Create GoogleService-Info.plist
        run: |
          mkdir -p iosApp/Firebase/Full iosApp/Firebase/Kids iosApp/iosApp
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > iosApp/Firebase/Full/GoogleService-Info.plist
          if [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_KIDS_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_KIDS_BASE64 }}" | base64 -d > iosApp/Firebase/Kids/GoogleService-Info.plist
          else
            echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > iosApp/Firebase/Kids/GoogleService-Info.plist
          fi
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > iosApp/iosApp/GoogleService-Info.plist

      - name: Build KMP XCFramework
        if: needs.detect.outputs.has_ios_changes != 'true'
        run: ./gradlew :teEcclesiaApp:assembleTeEcclesiaAppDebugXCFramework --parallel --build-cache

      - name: Generate SwiftPM Linkage Package
        if: needs.detect.outputs.has_ios_changes == 'true'
        run: |
          ./gradlew :teEcclesiaApp:generateSyntheticLinkageSwiftPMImportProjectForEmbedAndSignLinkage || true
          mkdir -p iosApp/KotlinMultiplatformLinkedPackage
          cp -R teEcclesiaApp/build/kotlin/swiftImport/ iosApp/KotlinMultiplatformLinkedPackage/

      - name: Build iOS app
        if: needs.detect.outputs.has_ios_changes == 'true'
        run: |
          export JAVA_HOME=$JAVA_HOME
          export PATH=$JAVA_HOME/bin:$PATH
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme "TeEcclesia" \
            -configuration Debug-Full \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath iosApp/DerivedData \
            build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build iOS app (Kids)
        if: |
          needs.detect.outputs.has_ios_changes == 'true' &&
          (contains(github.event.pull_request.labels.*.name, 'build-kids') || inputs.build_kids == true)
        run: |
          export JAVA_HOME=$JAVA_HOME
          export PATH=$JAVA_HOME/bin:$PATH
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme "TeEcclesia-Kids" \
            -configuration Debug-Kids \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath iosApp/DerivedData \
            build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
