name: Android

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  detect:
    name: Detect Changes
    uses: ./.github/workflows/detect-changed-modules.yml
    secrets: inherit

  build:
    name: Build
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create local.properties file
        run: |
          cat > local.properties << EOF
          BASE_URL=${{ secrets.BASE_URL }}
          KEYSTORE_STORE_FILE=androidApp/teEcclesia-keystore.jks
          KEYSTORE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          EOF

      - name: Decode and create keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > androidApp/teEcclesia-keystore.jks

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > androidApp/google-services.json

      - name: Build modules
        run: |
          MODULES='${{ needs.detect.outputs.android_modules }}'
          if echo "$MODULES" | jq -e 'index(":androidApp")' >/dev/null 2>&1; then
            echo "Building :androidApp:assembleDebug (covers all dependent modules)"
            ./gradlew :androidApp:assembleDebug --parallel --build-cache -x lint
          else
            TASKS=$(echo "$MODULES" | jq -r '.[] | "\(.)":assembleDebug' | tr '\n' ' ')
            echo "Building individual modules: $TASKS"
            ./gradlew $TASKS --parallel --build-cache -x lint
          fi
