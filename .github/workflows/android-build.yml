name: Android

on:
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  detect:
    name: Detect Changes
    uses: ./.github/workflows/detect-changed-modules.yml
    secrets: inherit

  build:
    name: Build
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create local.properties file
        run: |
          cat > local.properties << EOF
          BASE_URL=${{ secrets.BASE_URL }}
          KEYSTORE_STORE_FILE=androidApp/teEcclesia-keystore.jks
          KEYSTORE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          EOF

      - name: Decode and create keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > androidApp/teEcclesia-keystore.jks

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > androidApp/google-services.json

      - name: Build modules
        run: ./gradlew $(for m in $(echo '${{ needs.detect.outputs.android_modules }}' | jq -r '.[]'); do echo "$m:assemble"; done) --parallel --build-cache --no-daemon -x lint -x assembleRelease
