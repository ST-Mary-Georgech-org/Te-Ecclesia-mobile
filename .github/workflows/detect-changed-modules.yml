name: Changed Modules

on:
  workflow_call:
    outputs:
      modules:
        description: "Changed modules"
        value: ${{ jobs.detect.outputs.modules }}
      android_modules:
        description: "Changed Android modules"
        value: ${{ jobs.detect.outputs.android_modules }}
      has_changes:
        description: "If there are any changes"
        value: ${{ jobs.detect.outputs.has_changes }}
      ios_modules:
        description: "Changed iOS-capable modules"
        value: ${{ jobs.detect.outputs.ios_modules }}
      has_ios_changes:
        description: "If there are iOS app changes"
        value: ${{ jobs.detect.outputs.has_ios_changes }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      android_modules: ${{ steps.changes.outputs.android_modules }}
      ios_modules: ${{ steps.changes.outputs.ios_modules }}
      has_ios_changes: ${{ steps.changes.outputs.has_ios_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Get changed files
        id: changed-files-git
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }}...${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          fi
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Determine modules
        id: changes
        env:
          CHANGED_FILES_STR: ${{ steps.changed-files-git.outputs.changed_files }}
        run: |
          RAW_GRADLE_JSON=$(./gradlew -q exportModuleDeps 2>/dev/null | grep -Eo '\{.*\}' | tail -n 1 || true)
          export RAW_GRADLE_JSON
          python3 - << 'EOF'
          import json
          import os
          import re

          changed_files_raw = os.environ.get("CHANGED_FILES_STR", "")
          changed_files = [f.strip() for f in changed_files_raw.splitlines() if f.strip()]

          raw_json = os.environ.get("RAW_GRADLE_JSON", "").strip()
          modules = {}

          try:
              if raw_json:
                  data = json.loads(raw_json)
                  modules = data.get("modules", {})
          except Exception as e:
              print(f"Warning: Failed to parse Gradle JSON ({e})")

          # Dynamic fallback if exportModuleDeps is unavailable: parse settings.gradle(.kts)
          if not modules:
              print("Parsing settings.gradle(.kts) dynamically as fallback...")
              settings_file = "settings.gradle.kts" if os.path.exists("settings.gradle.kts") else "settings.gradle"
              if os.path.exists(settings_file):
                  with open(settings_file, "r") as sf:
                      for match in re.finditer(r'include\s*\(\s*["\'](:[^"\']+)["\']\s*\)', sf.read()):
                          mod = match.group(1)
                          mod_dir = mod.lstrip(":").replace(":", "/")
                          modules[mod] = {
                              "dir": mod_dir,
                              "hasAndroid": True,
                              "hasIos": True,
                              "dependents": []
                          }

          # 1. Global build configuration changes
          global_patterns = [
              r"^gradle/",
              r"^build-logic/",
              r"^\.github/",
              r"^gradle\.properties$",
              r"^settings\.gradle(\.kts)?$",
              r"^build\.gradle(\.kts)?$"
          ]
          is_global_change = any(any(re.search(pat, f) for pat in global_patterns) for f in changed_files)

          # 2. Native iOS project files (Xcode projects, Swift packages, etc.)
          native_ios_patterns = [
              r"^iosApp/",
              r"\.xcodeproj(/|$)",
              r"\.xcworkspace(/|$)",
              r"\.pbxproj$",
              r"\.xcconfig$",
              r"(^|/)Package\.swift$",
              r"(^|/)Podfile(\.lock)?$"
          ]
          has_native_ios_changes = any(any(re.search(pat, f) for pat in native_ios_patterns) for f in changed_files)

          # 3. Resolve affected modules
          directly_changed = set()
          affected = set()

          if is_global_change:
              affected = set(modules.keys())
          else:
              for f in changed_files:
                  for mod, info in modules.items():
                      mod_dir = info.get("dir", "").rstrip("/")
                      if mod_dir and (f == mod_dir or f.startswith(mod_dir + "/")):
                          directly_changed.add(mod)
                          affected.add(mod)
                          for dep in info.get("dependents", []):
                              affected.add(dep)

          # 4. Filter by platform capabilities
          android_modules = sorted([m for m in affected if modules.get(m, {}).get("hasAndroid", True)])
          ios_modules = sorted([m for m in affected if modules.get(m, {}).get("hasIos", True)])

          has_ios_changes = has_native_ios_changes or is_global_change or len(ios_modules) > 0
          has_changes = is_global_change or has_native_ios_changes or len(affected) > 0

          # 5. Output to GITHUB_OUTPUT
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as out:
                  out.write(f"has_changes={'true' if has_changes else 'false'}\n")
                  out.write(f"has_ios_changes={'true' if has_ios_changes else 'false'}\n")
                  out.write(f"modules<<EOF\n{json.dumps(sorted(list(affected)))}\nEOF\n")
                  out.write(f"android_modules<<EOF\n{json.dumps(android_modules)}\nEOF\n")
                  out.write(f"ios_modules<<EOF\n{json.dumps(ios_modules)}\nEOF\n")

          print("=== Detection Summary ===")
          print(f"Total changed files: {len(changed_files)}")
          print(f"Is global change: {is_global_change}")
          print(f"Has native iOS changes: {has_native_ios_changes}")
          print(f"Has changes: {has_changes}")
          print(f"Has iOS changes: {has_ios_changes}")
          print(f"Directly changed modules: {sorted(list(directly_changed))}")
          print(f"Total affected modules ({len(affected)}): {sorted(list(affected))}")
          print(f"Android modules ({len(android_modules)}): {android_modules}")
          print(f"iOS modules ({len(ios_modules)}): {ios_modules}")
          EOF