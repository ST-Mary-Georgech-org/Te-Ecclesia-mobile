name: Changed Modules

on:
  workflow_call:
    outputs:
      modules:
        description: "Changed modules"
        value: ${{ jobs.detect.outputs.modules }}
      android_modules:
        description: "Changed Android modules"
        value: ${{ jobs.detect.outputs.android_modules }}
      has_changes:
        description: "If there are any changes"
        value: ${{ jobs.detect.outputs.has_changes }}
      ios_modules:
        description: "Changed iOS-capable modules"
        value: ${{ jobs.detect.outputs.ios_modules }}
      has_ios_changes:
        description: "If there are iOS app changes"
        value: ${{ jobs.detect.outputs.has_ios_changes }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      android_modules: ${{ steps.changes.outputs.android_modules }}
      ios_modules: ${{ steps.changes.outputs.ios_modules }}
      has_ios_changes: ${{ steps.changes.outputs.has_ios_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Get changed files
        id: changed-files-git
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }}...${{ github.sha }})
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
          fi
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Determine modules
        id: changes
        run: |
          ALL_MODULES_JSON=$(./gradlew -q exportModuleDeps --no-configuration-cache | grep -Eo '^\{.*\}$' | tail -n 1)
          echo "All modules JSON: $ALL_MODULES_JSON"

          CHANGED_FILES="${{ steps.changed-files-git.outputs.changed_files }}"
          FALLBACK_ALL_MODULES='teEcclesiaApp designSystem identity/identityData identity/identityDomain identity/identityPresentation home/homePresentation identity/identityApi home/homeApi androidApp'
          IOS_MODULES='teEcclesiaApp identity/identityPresentation home/homePresentation'
          echo "All modules JSON: $ALL_MODULES_JSON"

          if echo "$ALL_MODULES_JSON" | jq -e . >/dev/null 2>&1; then
            ALL_MODULES=$(echo "$ALL_MODULES_JSON" | jq -r 'keys[]' | tr '\n' ' ')
          else
            echo "Unable to parse exportModuleDeps output; using fallback module list."
            ALL_MODULES_JSON='{}'
            ALL_MODULES="$FALLBACK_ALL_MODULES"
          fi

          FINAL_MODULES=""

          for file in $CHANGED_FILES; do
            for module in $ALL_MODULES; do
              if [[ "$file" == "$module"* ]]; then
                FINAL_MODULES="$FINAL_MODULES $module"
                # Add dependent modules
                if [ "$ALL_MODULES_JSON" != '{}' ]; then
                  DEPS=$(echo "$ALL_MODULES_JSON" | jq -r --arg module "$module" '.[$module][]?' 2>/dev/null || true)
                  for dep in $DEPS; do
                    FINAL_MODULES="$FINAL_MODULES $dep"
                  done
                fi
              fi
            done
          done

          FINAL_MODULES=$(echo "$FINAL_MODULES" | tr ' ' '\n' | awk 'NF' | sort -u | tr '\n' ' ')
          ANDROID_JSON_ARRAY=$(echo "$FINAL_MODULES" | tr ' ' '\n' | awk 'NF' | jq -R -s -c 'split("\n")[:-1]')
          JSON_ARRAY=$(echo "$FINAL_MODULES" | jq -R 'split(" ") | map(select(length > 0))' | jq -c '.')
          IOS_FILTERED=$(echo "$FINAL_MODULES" | tr ' ' '\n' | awk 'NF' | grep -F -x -f <(echo "$IOS_MODULES" | tr ' ' '\n') || true)
          IOS_JSON_ARRAY=$(echo "$IOS_FILTERED" | jq -R -s -c 'split("\n")[:-1]')

          if [ "$(echo "$JSON_ARRAY" | jq 'length')" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "modules<<EOF" >> $GITHUB_OUTPUT
            echo "$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "modules=[]" >> $GITHUB_OUTPUT
          fi
          
          echo "android_modules<<EOF" >> $GITHUB_OUTPUT
          echo "$ANDROID_JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
  
          echo "ios_modules<<EOF" >> $GITHUB_OUTPUT
          echo "$IOS_JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$(echo "$IOS_JSON_ARRAY" | jq 'length')" -gt 0 ]; then
            echo "has_ios_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_ios_changes=false" >> $GITHUB_OUTPUT
          fi